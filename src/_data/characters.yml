  anatomy:
  - part: 신체 비율
    detail: '**약 2.5 ~ 3.0등신 레트로 모던 데스크톱 컴패니언 로봇**

      • 도로시 키의 약 허리 높이(약 55~60cm 상당)로 책상 위나 옆에 자연스럽게 배치

      • 과도한 밀리터리 기계미를 배제하고, 둥글둥글하고 친근한 곡선 위주의 백색 외장재'
  - part: 모니터 헤드
    detail: '• 형태: 모서리가 부드럽게 라운딩된 CRT/모던 디스플레이 큐브 헤드 (`#E8ECEF`)

      • 안테나: 정수리 중앙에 솟아오른 얇은 황동 와이어 안테나 + **빛나는 노란색 미니 전구 팁 (`#FCD34D`)**'
  - part: 디지털 페이스
    detail: '• 디스플레이: 짙은 다크 차콜 글래스 화면 (`#1E293B`)

      • 디지털 아이: **발광하는 밝은 시안 블루 LED 눈 (`#38BDF8`)** (상태에 따라 하트, 윙크, 느낌표로 감정 표현)'
  - part: 흉부 코어 (Heart)
    detail: '• 가슴 중앙에 장착된 투명 유리 돔 윈도우

      • 내부: 따뜻한 호박색으로 맥동(Pulsing)하며 회전하는 **황금색 하트 코그휠 기어 (`#F59E0B`)**'
  - part: 관절 & 팔다리
    detail: '• 볼 조인트(Ball-joint)와 피벗 힌지로 연결된 3자유도 관절 팔과 탄탄한 다리

      • 손: 작은 전자 부품이나 핀셋을 정밀하게 잡을 수 있는 3지 핑거 엔드이펙터'
